<style>
  :root {
    --bg: #121417;
    --surface: #1a1d22;
    --border: rgba(255,255,255,0.09);

    --muted: #9aa0a8;
    --accent: #d9a441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .bg-video.active { opacity: 1; }
  .veil {
    position: fixed;
    inset: 0;
    background: rgba(18,20,23,0.60);
    z-index: 1;
  }
  .card { position: relative; z-index: 2; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }

  .avatar {
    width: 108px; height: 108px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(217,164,65,0.55);
    box-shadow: 0 0 28px rgba(217,164,65,0.30), 0 0 60px rgba(217,164,65,0.12);
    padding: 4px;
    background: var(--surface);
    margin-bottom: 22px;
  }
  .tagline {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--accent);
    max-width: 320px;
    margin: 0 auto 12px;
  }
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin-bottom: 14px;
  }
  .bio {
    font-size: 15px;
    line-height: 1.65;
    color: var(--muted);
    max-width: 320px;
    margin: 0 auto 34px;
  }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(0,0,0,0.15), 0 8px 24px rgba(0,0,0,0.30);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    transition: border-color .2s, transform .15s;
  }
  .link:hover { border-color: var(--accent); transform: translateY(-1px); }
  .link svg { width: 20px; height: 20px; flex-shrink: 0; fill: var(--accent); filter: drop-shadow(0 0 5px rgba(217,164,65,0.40)); }
  .link .arrow { margin-left: auto; fill: none; stroke: var(--muted); stroke-width: 2; width: 16px; height: 16px; }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
  }
  @media (min-width: 720px) {
    .card { max-width: 460px; }
    h1 { font-size: 34px; }
  }
h1,.tagline,.bio{text-shadow:0 1px 14px rgba(0,0,0,0.55);}

  <script>
    // Background clips: Mixkit Stock Video Free License (commercial use allowed, no attribution required)
    const clips = [
      'bg-1.mp4',  // gold bokeh A - mixkit.co/free-stock-video/blurred-multicolor-lights-bokeh-1177/ (gold-graded, modify allowed)
      'bg-2.mp4',  // gold silk ink - mixkit.co/free-stock-video/abstract-video-of-slowly-flowing-colored-inks-44793/ (gold-graded)
      'bg-3.mp4'   // gold bokeh B - mixkit.co/free-stock-video/blurred-multicolor-lights-bokeh-1177/ (gold-graded)
    ];
    const CLIP_MS = 4500;
    let i = 0;
    const A = document.getElementById('bgA'), B = document.getElementById('bgB');
    let front = A, back = B;
    front.src = clips[0];
    front.play().catch(() => {});
    setInterval(() => {
      i = (i + 1) % clips.length;
      back.src = clips[i];
      back.currentTime = 0;
      back.play().catch(() => {});
      back.classList.add('active');
      front.classList.remove('active');
      [front, back] = [back, front];
    }, CLIP_MS);
  </script>
